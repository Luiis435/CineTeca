<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano 50 - Real Time & Charts v5</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; }
    
    .header { text-align: center; margin-bottom: 20px; position: relative; }
    .header h1 { font-size: 1.5rem; color: var(--primary); }
    .header p { font-size: 0.85rem; color: var(--muted); }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 16px; font-size: 0.75rem; color: var(--muted); }
    .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--success); margin-right: 4px; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .btn-eye { position: absolute; right: 0; top: 0; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; cursor: pointer; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-weight: 700; font-size: 1rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .btn-checkin { width: 100%; background: var(--success); color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn-checkin:hover { opacity: 0.9; }

    .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box { background: var(--bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .stat-box label { font-size: 0.75rem; color: var(--muted); display: block; }
    .stat-box span { font-size: 1.1rem; font-weight: 700; }

    .asset-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .asset-row:last-child { border-bottom: none; }
    .asset-row:hover { background: rgba(255,255,255,0.02); }

    .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: var(--border); color: var(--muted); }
    .tag-opportunity { background: var(--success); color: #fff; font-weight: 600; font-size: 0.65rem; padding: 2px 4px; border-radius: 4px; margin-left: 4px; }

    .chart-container { position: relative; height: 200px; width: 100%; }
    
    .form-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    input, select, button { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-size: 0.85rem; }
    .btn-sub { background: var(--primary); color: #fff; font-weight: 600; cursor: pointer; border: none; }
    .btn-sec { background: var(--border); color: var(--text); font-weight: 600; cursor: pointer; border: none; }
  </style>
</head>
<body>

  <div class="header">
    <button class="btn-eye" onclick="togglePrivacidade()" id="btnEye">👁️</button>
    <h1>🎯 Plano R$ 50/mês</h1>
    <p>Tempo Real & Gráficos Individuais</p>
  </div>

  <!-- STATUS DO TEMPO REAL -->
  <div class="status-bar">
    <div><span class="pulse-dot"></span> Tempo Real Ativo</div>
    <div id="txtTimer">Próxima atualização: 15s</div>
  </div>

  <!-- CHECK-IN MENSAL -->
  <div class="card">
    <button class="btn-checkin" onclick="fazerCheckinMensal()">⚡ Check-in Aporte do Mês (R$ 50)</button>
  </div>

  <!-- RESUMO DE PATRIMÔNIO -->
  <div class="card">
    <div class="grid-stats">
      <div class="stat-box">
        <label>Patrimônio (Tempo Real)</label>
        <span id="txtTotal">R$ 0,00</span>
      </div>
      <div class="stat-box">
        <label>Total Aportado</label>
        <span id="txtAportado">R$ 0,00</span>
      </div>
    </div>
  </div>

  <!-- GRÁFICO INDIVIDUAL DO ATIVO SELECIONADO -->
  <div class="card">
    <div class="card-title">
      <span id="lblAtivoSelecionado">📈 Preço: GARE11</span>
      <small style="font-size:0.75rem; color:var(--muted)">Clique em qualquer ativo abaixo</small>
    </div>
    <div class="chart-container">
      <canvas id="chartAtivo"></canvas>
    </div>
  </div>

  <!-- ATIVOS DO PLANO -->
  <div class="card">
    <div class="card-title">💼 Ativos em Acompanhamento</div>
    <div id="listaAtivosPlano">Carregando dados em tempo real...</div>
  </div>

  <!-- ALOCAÇÃO DA CARTEIRA -->
  <div class="card">
    <div class="card-title">📊 Divisão do Patrimônio</div>
    <div class="chart-container">
      <canvas id="chartPie"></canvas>
    </div>
  </div>

  <!-- CADASTRO MANUAL -->
  <div class="card">
    <div class="card-title">⚙️ Ajustar Posição</div>
    <div class="form-inputs">
      <input type="text" id="inSymbol" placeholder="Ticker (Ex: CPLE3)" style="text-transform: uppercase;">
      <input type="number" id="inQtd" placeholder="Qtd" step="any">
      <input type="number" id="inPM" placeholder="Preço Pago" step="any">
    </div>
    <button class="btn-sub" style="width:100%; margin-top:8px;" onclick="salvarManual()">Salvar Ativo</button>
  </div>

<script>
  let modoOculto = false;
  let timerSegundos = 15;
  let ativoSelecionado = 'GARE11';

  let carteira = JSON.parse(localStorage.getItem('plano50_carteira_v5')) || [
    { symbol: 'GARE11', qtd: 1, pm: 8.10, dy: 0.011 },
    { symbol: 'GGRC11', qtd: 1, pm: 9.13, dy: 0.010 },
    { symbol: 'CPLE3',  qtd: 1, pm: 13.90, dy: 0.006 },
    { symbol: 'DOT',    qtd: 2.1363, pm: 8.50, dy: 0.000 }
  ];

  let historicoAportes = JSON.parse(localStorage.getItem('plano50_historico_v5')) || [
    { data: 'Início', aporte: 60.26, total: 60.26 }
  ];

  let cotacoes = {};
  let historicoPrecosAtivo = {}; // Guarda últimos preços para o gráfico em tempo real

  let chartPieInst, chartAtivoInst;

  function togglePrivacidade() {
    modoOculto = !modoOculto;
    document.getElementById('btnEye').innerText = modoOculto ? '🔒' : '👁️';
    renderizar();
  }

  function fmtVal(valor) {
    if (modoOculto) return 'R$ •••••';
    return `R$ ${valor.toFixed(2)}`;
  }

  async function carregarCotacoesTempoReal() {
    const tickersB3 = carteira.filter(c => c.symbol !== 'DOT').map(c => c.symbol).join(',');
    if (tickersB3) {
      try {
        const res = await fetch(`https://brapi.dev/api/quote/${tickersB3}`);
        const data = await res.json();
        if (data.results) {
          data.results.forEach(item => { 
            cotacoes[item.symbol] = item.regularMarketPrice; 
            registrarHistoricoPreco(item.symbol, item.regularMarketPrice);
          });
        }
      } catch(e) { console.log("Erro B3 API"); }
    }

    try {
      const resC = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=polkadot&vs_currencies=brl');
      const dataC = await resC.json();
      if(dataC.polkadot) {
        cotacoes['DOT'] = dataC.polkadot.brl;
        registrarHistoricoPreco('DOT', dataC.polkadot.brl);
      }
    } catch(e) { console.log("Erro Cripto API"); }

    renderizar();
  }

  function registrarHistoricoPreco(symbol, preco) {
    if (!historicoPrecosAtivo[symbol]) {
      // Cria dados fictícios iniciais de variação para o gráfico não nascer vazio
      historicoPrecosAtivo[symbol] = [preco * 0.98, preco * 0.99, preco * 0.995, preco];
    } else {
      historicoPrecosAtivo[symbol].push(preco);
      if (historicoPrecosAtivo[symbol].length > 10) historicoPrecosAtivo[symbol].shift(); // Mantém últimas 10 leituras
    }
  }

  function selecionarAtivo(symbol) {
    ativoSelecionado = symbol;
    document.getElementById('lblAtivoSelecionado').innerText = `📈 Preço em Tempo Real: ${symbol}`;
    renderizarGráficoAtivo();
  }

  function renderizar() {
    let patrimonioTotal = 0;
    let totalInvestido = 0;

    let htmlAtivos = '';
    let labelsPie = [];
    let dataPie = [];

    carteira.forEach(item => {
      const precoAtual = cotacoes[item.symbol] || item.pm || 0;
      const valorTotal = item.qtd * precoAtual;
      const investido = item.qtd * item.pm;

      patrimonioTotal += valorTotal;
      totalInvestido += investido;

      if (valorTotal > 0) {
        labelsPie.push(item.symbol);
        dataPie.push(valorTotal);
      }

      const ehOportunidade = precoAtual > 0 && precoAtual < item.pm;
      const tagOportunidade = ehOportunidade ? `<span class="tag-opportunity">🔥 Abaixo PM</span>` : '';

      htmlAtivos += `
        <div class="asset-row" onclick="selecionarAtivo('${item.symbol}')">
          <div>
            <strong>${item.symbol}</strong> ${tagOportunidade} <span class="tag">${item.qtd.toFixed(2)} u</span><br>
            <small style="color:var(--muted)">PM: ${fmtVal(item.pm)} | Tempo Real: ${fmtVal(precoAtual)}</small>
          </div>
          <div style="text-align:right;">
            <strong>${fmtVal(valorTotal)}</strong><br>
            <small style="color:${precoAtual >= item.pm ? 'var(--success)' : 'var(--warning)'}">
              ${((precoAtual - item.pm) / (item.pm || 1) * 100).toFixed(1)}%
            </small>
          </div>
        </div>
      `;
    });

    document.getElementById('listaAtivosPlano').innerHTML = htmlAtivos;
    document.getElementById('txtTotal').innerText = fmtVal(patrimonioTotal);
    document.getElementById('txtAportado').innerText = fmtVal(totalInvestido);

    renderizarGraficoPizza(labelsPie, dataPie);
    renderizarGráficoAtivo();
  }

  function renderizarGraficoPizza(labels, data) {
    const ctxPie = document.getElementById('chartPie').getContext('2d');
    if (chartPieInst) chartPieInst.destroy();
    chartPieInst = new Chart(ctxPie, {
      type: 'pie',
      data: { labels: labels, datasets: [{ data: data, backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'] }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc' } } } }
    });
  }

  function renderizarGráficoAtivo() {
    const dadosHistorico = historicoPrecosAtivo[ativoSelecionado] || [0];
    const labels = dadosHistorico.map((_, i) => `Check ${i + 1}`);

    const ctxAtivo = document.getElementById('chartAtivo').getContext('2d');
    if (chartAtivoInst) chartAtivoInst.destroy();
    chartAtivoInst = new Chart(ctxAtivo, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: `Cotação (${ativoSelecionado})`,
          data: dadosHistorico,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          fill: true,
          tension: 0.2
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#f8fafc' } } } }
    });
  }

  function fazerCheckinMensal() {
    const pGARE = cotacoes['GARE11'] || 8.10;
    const pGGRC = cotacoes['GGRC11'] || 9.13;
    const pCPLE = cotacoes['CPLE3'] || 13.90;

    atualizarAtivo('GARE11', 2, pGARE);
    atualizarAtivo('GGRC11', 2, pGGRC);
    const sobra = 50.00 - ((pGARE * 2) + (pGGRC * 2));
    if(sobra > 0) atualizarAtivo('CPLE3', sobra / pCPLE, pCPLE);

    salvarEstado();
    alert("Aporte registrado com cotações em tempo real!");
    renderizar();
  }

  function atualizarAtivo(symbol, qtdAdd, preco) {
    let item = carteira.find(c => c.symbol === symbol);
    if (item) {
      const novoTotal = item.qtd + qtdAdd;
      item.pm = ((item.qtd * item.pm) + (qtdAdd * preco)) / novoTotal;
      item.qtd = novoTotal;
    }
  }

  function salvarManual() {
    const symbol = document.getElementById('inSymbol').value.toUpperCase().trim();
    const qtd = parseFloat(document.getElementById('inQtd').value);
    const pm = parseFloat(document.getElementById('inPM').value);

    if (!symbol || isNaN(qtd)) return alert("Preencha Ticker e Quantidade");

    let item = carteira.find(c => c.symbol === symbol);
    if (item) {
      item.qtd = qtd;
      if (!isNaN(pm)) item.pm = pm;
    } else {
      carteira.push({ symbol, qtd, pm: pm || 0, dy: 0.008 });
    }

    salvarEstado();
    renderizar();
  }

  function salvarEstado() {
    localStorage.setItem('plano50_carteira_v5', JSON.stringify(carteira));
  }

  // LOOP DE TEMPO REAL (15 SEGUNDOS)
  setInterval(() => {
    timerSegundos--;
    if (timerSegundos <= 0) {
      timerSegundos = 15;
      carregarCotacoesTempoReal();
    }
    document.getElementById('txtTimer').innerText = `Próxima atualização: ${timerSegundos}s`;
  }, 1000);

  carregarCotacoesTempoReal();
</script>
</body>
</html>
