<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestRadar Terminal Pro</title>
  <style>
    :root {
      --bg: #080b11;
      --card: #121824;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
      --binance: #f0b90b;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; color: var(--accent); font-size: 1.6rem; letter-spacing: -0.5px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select, button { background-color: var(--card); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
    input { flex-grow: 1; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }

    .btn-action { background-color: var(--binance); color: #000; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }

    .grid-crypto { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .crypto-card { background-color: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .analysis-box { border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .verdict-strong-buy { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); }
    .verdict-buy { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent); color: var(--accent); }
    .verdict-neutral { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: var(--warning); }
    .verdict-sell { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--danger); color: var(--danger); }

    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; background: var(--bg); padding: 10px; border-radius: 6px; }
    .metric-item span { display: block; font-size: 0.7rem; color: var(--text-muted); }
    .metric-item strong { font-size: 0.9rem; }

    .chart-container { height: 260px; width: 100%; border-radius: 6px; overflow: hidden; background: #000; }
    .drop { color: var(--danger); }
    .gain { color: var(--success); }
    .loading { text-align: center; padding: 40px; font-size: 1rem; color: var(--text-muted); }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ InvestRadar Terminal Pro</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabOportunidades" onclick="mudarAba('oportunidades')">Radar Quantitativo</button>
    <button class="tab-btn" id="tabMinhas" onclick="mudarAba('minhas')">Carteira / Favoritos</button>
  </div>

  <div class="controls">
    <select id="filtroTipo" onchange="renderizar()">
      <option value="CRIPTO">🪙 Criptomoedas & Memes</option>
      <option value="ACAO">🏢 Ações (B3)</option>
      <option value="FII">🏢 FIIs (Fundos Imobiliários)</option>
    </select>

    <input type="text" id="campoBusca" placeholder="🔍 Ticker (Ex: PEPE, SOL, PETR4, MXRF11)..." oninput="renderizar()">
    <input type="text" id="novoAtivoInput" placeholder="Adicionar Ticker" style="max-width: 140px;">
    <button onclick="cadastrarAtivo()">➕ Add</button>
    <button onclick="carregarDados()">🔄 Sync</button>
  </div>

  <div id="loading" class="loading">Processando sinais de mercado...</div>
  <div id="gridCriptos" class="grid-crypto"></div>
</div>

<script>
  let moedasGlobais = [];
  let meusAtivos = JSON.parse(localStorage.getItem('meusAtivosPro')) || [
    { symbol: 'BTC', tipo: 'CRIPTO' },
    { symbol: 'PEPE', tipo: 'CRIPTO' },
    { symbol: 'PETR4', tipo: 'ACAO' },
    { symbol: 'MXRF11', tipo: 'FII' }
  ];
  let abaAtual = 'oportunidades';

  function mudarAba(aba) {
    abaAtual = aba;
    document.getElementById('tabOportunidades').classList.toggle('active', aba === 'oportunidades');
    document.getElementById('tabMinhas').classList.toggle('active', aba === 'minhas');
    renderizar();
  }

  function cadastrarAtivo() {
    const input = document.getElementById('novoAtivoInput');
    const symbol = input.value.trim().toUpperCase();
    const tipo = document.getElementById('filtroTipo').value;

    if (symbol && !meusAtivos.some(a => a.symbol === symbol)) {
      meusAtivos.push({ symbol, tipo });
      localStorage.setItem('meusAtivosPro', JSON.stringify(meusAtivos));
      input.value = '';
      if (abaAtual === 'minhas') renderizar();
    }
  }

  function removerAtivo(symbol) {
    meusAtivos = meusAtivos.filter(a => a.symbol !== symbol);
    localStorage.setItem('meusAtivosPro', JSON.stringify(meusAtivos));
    renderizar();
  }

  async function carregarDados() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('gridCriptos').innerHTML = '';

    try {
      const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=true');
      moedasGlobais = await res.json();
      renderizar();
    } catch (err) {
      document.getElementById('loading').innerText = 'Erro de sincronização de dados.';
    }
  }

  // CÁLCULO TÉCNICO AVANÇADO
  function calcularAnaliseAvancada(prices, change24h, volume, rank) {
    if (!prices || prices.length < 20) return { score: 50, rsi: 50, signal: "NEUTRO", classe: "verdict-neutral", desc: "Dados insuficientes" };

    // 1. RSI (14 períodos)
    let gains = 0, losses = 0;
    const slice = prices.slice(-15);
    for (let i = 1; i < slice.length; i++) {
      let diff = slice[i] - slice[i-1];
      diff >= 0 ? gains += diff : losses += Math.abs(diff);
    }
    let rs = (gains / 14) / ((losses / 14) || 1);
    let rsi = Math.round(100 - (100 / (1 + rs)));

    // 2. Média Móvel Simples (SMA 20 vs Preço Atual)
    let sma20 = prices.slice(-20).reduce((a, b) => a + b, 0) / 20;
    let precoAtual = prices[prices.length - 1];
    let estaAbaixoSMA = precoAtual < sma20;

    // Pontuação Quantitativa
    let score = 50;
    let motivos = [];

    if (rsi <= 30) { score += 30; motivos.push("RSI Sobrevendido"); }
    else if (rsi <= 42) { score += 15; motivos.push("RSI Baixo"); }
    else if (rsi >= 70) { score -= 25; motivos.push("RSI Sobrecomprado"); }

    if (change24h <= -7) { score += 20; motivos.push("Correção Acentuada"); }
    else if (change24h > 10) { score -= 15; motivos.push("Esticado no Curto Prazo"); }

    if (estaAbaixoSMA) { score += 10; motivos.push("Abaixo da SMA20 (Desconto)"); }

    let signal = "NEUTRO";
    let classe = "verdict-neutral";

    if (score >= 75) { signal = "FORTE COMPRA"; classe = "verdict-strong-buy"; }
    else if (score >= 60) { signal = "COMPRA MODERADA"; classe = "verdict-buy"; }
    else if (score <= 35) { signal = "VENDA / EVITAR"; classe = "verdict-sell"; }

    return { score, rsi, signal, classe, desc: motivos.join(" • ") || "Preço em consolidação" };
  }

  // ROTEADOR DE SIMBOLOS PARA O TRADINGVIEW (SOLUÇÃO DE MEMECOINS)
  function resolverSimboloTradingView(symbol, tipo) {
    if (tipo === 'ACAO' || tipo === 'FII') return `BMFBOVESPA:${symbol}`;
    
    // Lista de Memecoins populares que usam Binance/OKX USDT
    const memesBinance = ['PEPE', 'FLOKI', 'BONK', 'WIF', 'SHIB', 'DOGE', 'MEME', 'BOME', 'ORDI', '1000SATS'];
    if (memesBinance.includes(symbol)) return `BINANCE:${symbol}USDT`;

    return `BINANCE:${symbol}USDT`;
  }

  function renderizar() {
    const busca = document.getElementById('campoBusca').value.toLowerCase();
    const tipoFiltro = document.getElementById('filtroTipo').value;
    const container = document.getElementById('gridCriptos');
    container.innerHTML = '';

    let lista = [];

    if (abaAtual === 'minhas') {
      lista = meusAtivos.filter(a => a.tipo === tipoFiltro && a.symbol.toLowerCase().includes(busca))
        .map(a => {
          let g = moedasGlobais.find(m => m.symbol.toUpperCase() === a.symbol);
          return g ? { ...g, tipo: a.tipo } : { symbol: a.symbol, name: a.symbol, tipo: a.tipo };
        });
    } else {
      if (tipoFiltro === 'CRIPTO') {
        lista = moedasGlobais
          .filter(m => m.name.toLowerCase().includes(busca) || m.symbol.toLowerCase().includes(busca))
          .slice(0, 12)
          .map(m => ({ ...m, symbol: m.symbol.toUpperCase(), tipo: 'CRIPTO' }));
      } else {
        const b3Padrao = tipoFiltro === 'ACAO' ? ['PETR4', 'VALE3', 'ITUB4', 'BBAS3', 'WEGE3'] : ['MXRF11', 'HGLG11', 'XPML11', 'KNCR11'];
        lista = b3Padrao.filter(s => s.toLowerCase().includes(busca)).map(s => ({ symbol: s, name: s, tipo: tipoFiltro }));
      }
    }

    document.getElementById('loading').style.display = 'none';

    if (lista.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Nenhum ativo encontrado.</p>';
      return;
    }

    lista.forEach((item, idx) => {
      const symbolUpper = item.symbol.toUpperCase();
      const prices = item.sparkline_in_7d ? item.sparkline_in_7d.price : [];
      const analise = calcularAnaliseAvancada(prices, item.price_change_percentage_24h || 0, item.total_volume || 0, item.market_cap_rank || 999);
      
      const tvSymbol = resolverSimboloTradingView(symbolUpper, item.tipo);
      const chartId = `tv_chart_${symbolUpper}_${idx}`;
      const linkTrade = item.tipo === 'CRIPTO' ? `https://www.binance.com/pt-BR/trade/${symbolUpper}_USDT?type=spot` : `https://www.google.com/finance/quote/${symbolUpper}:BVMF`;

      const card = document.createElement('div');
      card.className = 'crypto-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="display:flex; align-items:center; gap:8px;">
            ${item.image ? `<img src="${item.image}" style="width:24px; height:24px;">` : '📈'}
            <strong>${item.name} (${symbolUpper})</strong>
          </div>
          <div>
            ${abaAtual === 'minhas' ? `<button onclick="removerAtivo('${symbolUpper}')" style="background:var(--danger); border:none; margin-right:4px;">🗑️</button>` : ''}
            <a href="${linkTrade}" target="_blank" class="btn-action">${item.tipo === 'CRIPTO' ? '🟡 Binance' : '📊 Cotar'}</a>
          </div>
        </div>

        <div class="analysis-box ${analise.classe}">
          <div>
            <strong style="font-size:0.85rem;">SINAL: ${analise.signal}</strong>
            <div style="font-size:0.75rem; opacity:0.9; margin-top:2px;">${analise.desc}</div>
          </div>
          <div style="text-align:right;">
            <span style="font-size:0.65rem; display:block;">SCORE QUANT</span>
            <strong style="font-size:1.1rem;">${analise.score}/100</strong>
          </div>
        </div>

        ${item.current_price ? `
        <div class="metrics-grid">
          <div class="metric-item"><span>Preço</span><strong>$${item.current_price.toLocaleString('en-US')}</strong></div>
          <div class="metric-item"><span>Var 24h</span><strong class="${item.price_change_percentage_24h < 0 ? 'drop' : 'gain'}">${item.price_change_percentage_24h.toFixed(2)}%</strong></div>
          <div class="metric-item"><span>RSI (14)</span><strong>${analise.rsi}</strong></div>
          <div class="metric-item"><span>Vol 24h</span><strong>$${(item.total_volume / 1000000).toFixed(1)}M</strong></div>
        </div>
        ` : ''}

        <div id="${chartId}" class="chart-container"></div>
      `;

      container.appendChild(card);

      setTimeout(() => {
        new TradingView.widget({
          "autosize": true,
          "symbol": tvSymbol,
          "interval": "D",
          "theme": "dark",
          "style": "1",
          "locale": "br",
          "hide_top_toolbar": false,
          "allow_symbol_change": true,
          "container_id": chartId
        });
      }, 150);
    });
  }

  carregarDados();
</script>

</body>
</html>
