<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestRadar Pro - Cripto, Ações & FIIs</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151d2a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --binance: #f0b90b;
      --b3: #00529b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; color: var(--accent); }

    .tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--card);
      border: 1px solid #334155;
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select, button {
      background-color: var(--card);
      color: var(--text);
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
    }
    input { flex-grow: 1; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }

    .btn-action {
      background-color: var(--binance);
      color: #000;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      display: inline-block;
    }

    .grid-crypto { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .crypto-card {
      background-color: var(--card);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .analysis-box {
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .verdict-good { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--success); color: var(--success); }
    .verdict-medium { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: var(--warning); }
    .verdict-bad { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      background: var(--bg);
      padding: 12px;
      border-radius: 8px;
    }
    .metric-item span { display: block; font-size: 0.75rem; color: var(--text-muted); }
    .metric-item strong { font-size: 1rem; }

    .chart-container { height: 280px; width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
    .drop { color: var(--danger); }
    .loading { text-align: center; padding: 40px; font-size: 1.2rem; }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>📈 InvestRadar Pro - Cripto, Ações & FIIs</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabOportunidades" onclick="mudarAba('oportunidades')">⚡ Radar de Oportunidades</button>
    <button class="tab-btn" id="tabMinhas" onclick="mudarAba('minhas')">⭐ Meus Ativos Cadastrados</button>
  </div>

  <div class="controls">
    <select id="filtroTipo" onchange="renderizar()">
      <option value="CRIPTO">🪙 Criptomoedas</option>
      <option value="ACAO">🏢 Ações (B3)</option>
      <option value="FII">🏢 FIIs (Fundos Imobiliários)</option>
    </select>

    <input type="text" id="campoBusca" placeholder="🔍 Buscar ativo (Ex: SOL, PETR4, MXRF11)..." oninput="renderizar()">
    
    <input type="text" id="novoAtivoInput" placeholder="Ticker (Ex: VALE3)" style="max-width: 180px;">
    <button onclick="cadastrarAtivo()">➕ Cadastrar</button>
    <button onclick="carregarDados()">🔄 Atualizar</button>
  </div>

  <div id="loading" class="loading">Analisando dados do mercado...</div>
  <div id="gridCriptos" class="grid-crypto"></div>
</div>

<script>
  let moedasGlobais = [];
  
  // Ativos cadastrados padrão
  let meusAtivos = JSON.parse(localStorage.getItem('meusAtivos')) || [
    { symbol: 'BTC', tipo: 'CRIPTO' },
    { symbol: 'ETH', tipo: 'CRIPTO' },
    { symbol: 'PETR4', tipo: 'ACAO' },
    { symbol: 'VALE3', tipo: 'ACAO' },
    { symbol: 'MXRF11', tipo: 'FII' },
    { symbol: 'HGLG11', tipo: 'FII' }
  ];

  let abaAtual = 'oportunidades';

  function mudarAba(aba) {
    abaAtual = aba;
    document.getElementById('tabOportunidades').classList.toggle('active', aba === 'oportunidades');
    document.getElementById('tabMinhas').classList.toggle('active', aba === 'minhas');
    renderizar();
  }

  function cadastrarAtivo() {
    const input = document.getElementById('novoAtivoInput');
    const symbol = input.value.trim().toUpperCase();
    const tipo = document.getElementById('filtroTipo').value;

    if (symbol && !meusAtivos.some(a => a.symbol === symbol)) {
      meusAtivos.push({ symbol, tipo });
      localStorage.setItem('meusAtivos', JSON.stringify(meusAtivos));
      input.value = '';
      if (abaAtual === 'minhas') renderizar();
    }
  }

  function removerAtivo(symbol) {
    meusAtivos = meusAtivos.filter(a => a.symbol !== symbol);
    localStorage.setItem('meusAtivos', JSON.stringify(meusAtivos));
    renderizar();
  }

  async function carregarDados() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('gridCriptos').innerHTML = '';

    try {
      const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=true');
      moedasGlobais = await res.json();
      renderizar();
    } catch (err) {
      document.getElementById('loading').innerText = 'Erro ao carregar dados do mercado.';
    }
  }

  function calcularRsiAproximado(m) {
    if (!m.sparkline_in_7d || !m.sparkline_in_7d.price) return 50;
    const preços = m.sparkline_in_7d.price.slice(-24);
    let ganhos = 0, perdas = 0;
    for (let i = 1; i < preços.length; i++) {
      const diff = preços[i] - preços[i - 1];
      diff >= 0 ? ganhos += diff : perdas += Math.abs(diff);
    }
    if (perdas === 0) return 100;
    const rs = (ganhos / 24) / (perdas / 24);
    return Math.round(100 - (100 / (1 + rs)));
  }

  function analisarOportunidade(m, rsi, tipo) {
    let score = 50;
    let motivos = [];

    if (tipo === 'CRIPTO') {
      if (m.price_change_percentage_24h <= -5) { score += 25; motivos.push("Queda acentuada em 24h"); }
      if (rsi <= 35) { score += 25; motivos.push("RSI em zona de sobrevenda"); }
      if (m.market_cap_rank <= 30) { score += 15; motivos.push("Alta liquidez/Segurança no setor"); }
    } else {
      score = 60;
      motivos.push("Ativo de renda variável/B3 (Analise o gráfico técnico)");
    }

    let status = "";
    let classe = "";

    if (score >= 65) {
      status = "🟢 VALE A PENA (Ponto de Entrada Promissor)";
      classe = "verdict-good";
    } else if (score >= 40) {
      status = "🟡 ATENÇÃO (Aguarde confirmação no gráfico)";
      classe = "verdict-medium";
    } else {
      status = "🔴 EVITAR NO MOMENTO";
      classe = "verdict-bad";
    }

    return { status, classe, score, resumo: motivos.join(" + ") };
  }

  function renderizar() {
    const busca = document.getElementById('campoBusca').value.toLowerCase();
    const tipoFiltro = document.getElementById('filtroTipo').value;
    const container = document.getElementById('gridCriptos');
    container.innerHTML = '';

    let listaExibicao = [];

    if (abaAtual === 'minhas') {
      listaExibicao = meusAtivos.filter(a => 
        a.tipo === tipoFiltro && a.symbol.toLowerCase().includes(busca)
      ).map(a => ({ symbol: a.symbol, tipo: a.tipo, name: a.symbol }));
    } else {
      if (tipoFiltro === 'CRIPTO') {
        listaExibicao = moedasGlobais
          .filter(m => (m.name.toLowerCase().includes(busca) || m.symbol.toLowerCase().includes(busca)) && m.price_change_percentage_24h < 0)
          .slice(0, 10)
          .map(m => ({ ...m, symbol: m.symbol.toUpperCase(), tipo: 'CRIPTO' }));
      } else {
        // Exemplo de ativos B3 pré-carregados para o radar
        const b3Padrao = tipoFiltro === 'ACAO' 
          ? ['PETR4', 'VALE3', 'ITUB4', 'BBAS3', 'WEGE3'] 
          : ['MXRF11', 'HGLG11', 'XPML11', 'KNCR11', 'B3SA3'];

        listaExibicao = b3Padrao
          .filter(s => s.toLowerCase().includes(busca))
          .map(s => ({ symbol: s, tipo: tipoFiltro, name: s }));
      }
    }

    document.getElementById('loading').style.display = 'none';

    if (listaExibicao.length === 0) {
      container.innerHTML = '<p style="text-align:center;">Nenhum ativo encontrado para os filtros selecionados.</p>';
      return;
    }

    listaExibicao.forEach((item, idx) => {
      const rsi = item.sparkline_in_7d ? calcularRsiAproximado(item) : 50;
      const analise = analisarOportunidade(item, rsi, item.tipo);
      const symbolUpper = item.symbol.toUpperCase();
      const chartId = `tradingview_${symbolUpper}_${idx}`;

      let tvSymbol = `CRYPTO:${symbolUpper}USD`;
      let linkNegociar = `https://www.binance.com/pt-BR/trade/${symbolUpper}_USDT?type=spot`;
      let txtBtn = "🟡 Ir para Binance";

      if (item.tipo !== 'CRIPTO') {
        tvSymbol = `BMFBOVESPA:${symbolUpper}`;
        linkNegociar = `https://www.google.com/finance/quote/${symbolUpper}:BVMF`;
        txtBtn = "📊 Cotação Google Finance";
      }

      const card = document.createElement('div');
      card.className = 'crypto-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div style="display:flex; align-items:center; gap:10px;">
            ${item.image ? `<img src="${item.image}" style="width:30px; height:30px;">` : '📈'}
            <h3 style="margin:0;">${item.name || symbolUpper} (${symbolUpper})</h3>
          </div>
          <div>
            ${abaAtual === 'minhas' ? `<button onclick="removerAtivo('${symbolUpper}')" style="background:#ef4444; border:none; margin-right:5px;">🗑️</button>` : ''}
            <a href="${linkNegociar}" target="_blank" class="btn-action">${txtBtn}</a>
          </div>
        </div>

        <div class="analysis-box ${analise.classe}">
          <div>
            <strong>${analise.status}</strong>
            <div style="font-size:0.8rem; margin-top:4px;">Motivo: ${analise.resumo}</div>
          </div>
          <div style="text-align:right;">
            <span style="font-size:0.75rem;">Score de Oportunidade</span>
            <div style="font-size:1.2rem; font-weight:bold;">${analise.score}/100</div>
          </div>
        </div>

        ${item.current_price ? `
        <div class="metrics-grid">
          <div class="metric-item">
            <span>Preço</span>
            <strong>$${item.current_price.toLocaleString('en-US')}</strong>
          </div>
          <div class="metric-item">
            <span>Varição 24h</span>
            <strong class="drop">${item.price_change_percentage_24h.toFixed(2)}%</strong>
          </div>
          <div class="metric-item">
            <span>RSI Est.</span>
            <strong>${rsi}</strong>
          </div>
          <div class="metric-item">
            <span>Volume</span>
            <strong>$${(item.total_volume / 1000000).toFixed(1)}M</strong>
          </div>
        </div>
        ` : ''}

        <div>
          <div id="${chartId}" class="chart-container"></div>
        </div>
      `;

      container.appendChild(card);

      setTimeout(() => {
        new TradingView.widget({
          "autosize": true,
          "symbol": tvSymbol,
          "interval": "D",
          "theme": "dark",
          "style": "1",
          "locale": "br",
          "hide_top_toolbar": false,
          "container_id": chartId
        });
      }, 200);
    });
  }

  carregarDados();
</script>

</body>
</html>
