<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CriptoRadar Pro - Análise Automática</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151d2a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --binance: #f0b90b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; color: var(--accent); }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn {
      background: var(--card);
      border: 1px solid #334155;
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    input, button {
      background-color: var(--card);
      color: var(--text);
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
    }
    input { flex-grow: 1; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }

    .btn-binance {
      background-color: var(--binance);
      color: #000;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      display: inline-block;
    }

    .grid-crypto { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .crypto-card {
      background-color: var(--card);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Caixa do Veredito Automático */
    .analysis-box {
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .verdict-good { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--success); color: var(--success); }
    .verdict-medium { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); color: var(--warning); }
    .verdict-bad { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      background: var(--bg);
      padding: 12px;
      border-radius: 8px;
    }
    .metric-item span { display: block; font-size: 0.75rem; color: var(--text-muted); }
    .metric-item strong { font-size: 1rem; }

    .chart-container { height: 280px; width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
    .drop { color: var(--danger); }
    .loading { text-align: center; padding: 40px; font-size: 1.2rem; }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>🔥 CriptoRadar - Análise Automática de Oportunidades</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabOportunidades" onclick="mudarAba('oportunidades')">⚡ Oportunidades de Compra</button>
    <button class="tab-btn" id="tabMinhas" onclick="mudarAba('minhas')">⭐ Minhas Moedas Cadastradas</button>
  </div>

  <div class="controls">
    <input type="text" id="campoBusca" placeholder="🔍 Buscar moeda (Ex: SOL, BTC)..." oninput="renderizar()">
    <input type="text" id="novaMoedaInput" placeholder="Cadastrar Symbol (Ex: ADA, MATIC)" style="max-width: 220px;">
    <button onclick="cadastrarMoeda()">➕ Cadastrar</button>
    <button onclick="carregarDados()">🔄 Atualizar</button>
  </div>

  <div id="loading" class="loading">Analisando mercado e calculando indicadores...</div>
  <div id="gridCriptos" class="grid-crypto"></div>
</div>

<script>
  let moedasGlobais = [];
  let minhasMoedas = JSON.parse(localStorage.getItem('minhasMoedas')) || ['BTC', 'ETH', 'SOL'];
  let abaAtual = 'oportunidades';

  function mudarAba(aba) {
    abaAtual = aba;
    document.getElementById('tabOportunidades').classList.toggle('active', aba === 'oportunidades');
    document.getElementById('tabMinhas').classList.toggle('active', aba === 'minhas');
    renderizar();
  }

  function cadastrarMoeda() {
    const input = document.getElementById('novaMoedaInput');
    const symbol = input.value.trim().toUpperCase();
    if (symbol && !minhasMoedas.includes(symbol)) {
      minhasMoedas.push(symbol);
      localStorage.setItem('minhasMoedas', JSON.stringify(minhasMoedas));
      input.value = '';
      if (abaAtual === 'minhas') renderizar();
    }
  }

  function removerMoeda(symbol) {
    minhasMoedas = minhasMoedas.filter(s => s !== symbol);
    localStorage.setItem('minhasMoedas', JSON.stringify(minhasMoedas));
    renderizar();
  }

  async function carregarDados() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('gridCriptos').innerHTML = '';

    try {
      const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=150&page=1&sparkline=true');
      moedasGlobais = await res.json();
      renderizar();
    } catch (err) {
      document.getElementById('loading').innerText = 'Erro ao carregar dados do mercado.';
    }
  }

  function calcularRsiAproximado(m) {
    if (!m.sparkline_in_7d || !m.sparkline_in_7d.price) return 50;
    const preços = m.sparkline_in_7d.price.slice(-24);
    let ganhos = 0, perdas = 0;
    for (let i = 1; i < preços.length; i++) {
      const diff = preços[i] - preços[i - 1];
      diff >= 0 ? ganhos += diff : perdas += Math.abs(diff);
    }
    if (perdas === 0) return 100;
    const rs = (ganhos / 24) / (perdas / 24);
    return Math.round(100 - (100 / (1 + rs)));
  }

  // ALGORITMO DE ANÁLISE AUTOMÁTICA
  function analisarOportunidade(m, rsi) {
    let score = 0;
    let motivos = [];

    // 1. Queda acentuada (Sobrevenda)
    if (m.price_change_percentage_24h <= -5) { score += 35; motivos.push("Queda forte de 24h (Desconto)"); }
    else if (m.price_change_percentage_24h < 0) { score += 15; motivos.push("Leve queda recente"); }

    // 2. Indicador RSI
    if (rsi <= 30) { score += 40; motivos.push("RSI muito baixo (Sobrevendido)"); }
    else if (rsi <= 40) { score += 20; motivos.push("RSI moderado/baixo"); }

    // 3. Segurança do Projeto (Market Cap)
    if (m.market_cap_rank <= 30) { score += 25; motivos.push("Projeto sólido (Top 30 Market Cap)"); }
    else if (m.market_cap_rank <= 100) { score += 10; motivos.push("Risco intermediário"); }

    let status = "";
    let classe = "";

    if (score >= 65) {
      status = "🟢 VALE A PENA (Oportunidade de Compra)";
      classe = "verdict-good";
    } else if (score >= 40) {
      status = "🟡 ATENÇÃO (Aguarde ou entre fracionado)";
      classe = "verdict-medium";
    } else {
      status = "🔴 EVITAR NO MOMENTO (Sem sinal claro)";
      classe = "verdict-bad";
    }

    return { status, classe, score, resumo: motivos.join(" + ") };
  }

  function renderizar() {
    const busca = document.getElementById('campoBusca').value.toLowerCase();
    const container = document.getElementById('gridCriptos');
    container.innerHTML = '';

    let lista = moedasGlobais.filter(m => {
      const passaBusca = m.name.toLowerCase().includes(busca) || m.symbol.toLowerCase().includes(busca);
      if (abaAtual === 'minhas') {
        return passaBusca && minhasMoedas.includes(m.symbol.toUpperCase());
      } else {
        return passaBusca && m.price_change_percentage_24h < 0;
      }
    });

    document.getElementById('loading').style.display = 'none';

    if (lista.length === 0) {
      container.innerHTML = '<p style="text-align:center;">Nenhuma moeda encontrada.</p>';
      return;
    }

    lista.slice(0, 10).forEach((m, idx) => {
      const rsi = calcularRsiAproximado(m);
      const analise = analisarOportunidade(m, rsi);
      const symbolUpper = m.symbol.toUpperCase();
      const binanceLink = `https://www.binance.com/pt-BR/trade/${symbolUpper}_USDT?type=spot`;
      const chartId = `tradingview_${m.id}_${idx}`;

      const card = document.createElement('div');
      card.className = 'crypto-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${m.image}" style="width:30px; height:30px;">
            <h3 style="margin:0;">${m.name} (${symbolUpper})</h3>
          </div>
          <div>
            ${abaAtual === 'minhas' ? `<button onclick="removerMoeda('${symbolUpper}')" style="background:#ef4444; border:none; margin-right:5px;">🗑️</button>` : ''}
            <a href="${binanceLink}" target="_blank" class="btn-binance">🟡 Ir para Binance</a>
          </div>
        </div>

        <!-- PAINEL DE ANÁLISE AUTOMÁTICA -->
        <div class="analysis-box ${analise.classe}">
          <div>
            <strong>${analise.status}</strong>
            <div style="font-size:0.8rem; margin-top:4px;">Motivo: ${analise.resumo}</div>
          </div>
          <div style="text-align:right;">
            <span style="font-size:0.75rem;">Score de Oportunidade</span>
            <div style="font-size:1.2rem; font-weight:bold;">${analise.score}/100</div>
          </div>
        </div>

        <div class="metrics-grid">
          <div class="metric-item">
            <span>Preço</span>
            <strong>$${m.current_price.toLocaleString('en-US')}</strong>
          </div>
          <div class="metric-item">
            <span>Queda 24h</span>
            <strong class="drop">${m.price_change_percentage_24h.toFixed(2)}%</strong>
          </div>
          <div class="metric-item">
            <span>RSI Est.</span>
            <strong>${rsi}</strong>
          </div>
          <div class="metric-item">
            <span>Volume</span>
            <strong>$${(m.total_volume / 1000000).toFixed(1)}M</strong>
          </div>
        </div>

        <div>
          <div id="${chartId}" class="chart-container"></div>
        </div>
      `;

      container.appendChild(card);

      setTimeout(() => {
        new TradingView.widget({
          "autosize": true,
          "symbol": `BINANCE:${symbolUpper}USDT`,
          "interval": "D",
          "theme": "dark",
          "style": "1",
          "locale": "br",
          "hide_top_toolbar": false,
          "container_id": chartId
        });
      }, 200);
    });
  }

  carregarDados();
</script>

</body>
</html>
